name: Daily property hunt

on:
  schedule:
    # 17:00 UTC = 6am NZ daylight time (5am in winter). GitHub can start scheduled runs a little late.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also refresh sale/CV ratios and sold results (normally Sundays)"
        type: boolean
        default: false

# Never run two hunts at once; a manual run waits for a scheduled one.
concurrency:
  group: property-hunt
  cancel-in-progress: false

jobs:
  # 1. One hunt per city, on Windows (the scripts are Windows PowerShell); each stages its files to upload.
  #    akl = Auckland (also uploads the website pages), chc = Christchurch.
  hunt:
    strategy:
      fail-fast: false
      matrix:
        region: [akl, chc]
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Run the hunt
        shell: powershell
        env:
          REGION: ${{ matrix.region }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_SITE_DIR: ${{ vars.FTP_SITE_DIR }}
          FTP_STATE_DIR: ${{ vars.FTP_STATE_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WEEKLY: ${{ github.event.inputs.weekly }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File cloud\run.ps1
      - name: Hand the files to the upload job
        uses: actions/upload-artifact@v4
        with:
          name: outbox-${{ matrix.region }}
          path: ${{ runner.temp }}/outbox
          retention-days: 3

  # 2. Upload from Linux with lftp: Windows' TLS makes Hostinger abort encrypted FTP uploads (426).
  #    Runs for each city whose hunt finished, even if the other city's hunt failed.
  upload:
    needs: hunt
    if: ${{ always() }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        region: [akl, chc]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # If this city's hunt failed there's nothing to upload: skip quietly (the hunt job's log shows why).
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: outbox-${{ matrix.region }}
          path: outbox
      - name: Nothing to upload
        if: ${{ steps.dl.outcome != 'success' }}
        run: echo "The ${{ matrix.region }} hunt didn't finish, so nothing was uploaded for it. Open that city's hunt job for the error."
      - name: Upload the website and state to Hostinger
        if: ${{ steps.dl.outcome == 'success' }}
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          cd outbox
          # Drop spaces or line breaks pasted around the secrets.
          FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
          export LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Encrypted FTP is required; the certificate names Hostinger's server, not the IP, so its name isn't checked.
          lftp -c "set cmd:fail-exit yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 4; set net:reconnect-interval-base 5; set net:timeout 30; open --env-password -u \"$FTP_USER\" \"ftp://$(cat host.txt)\"; source upload.lftp"
          echo "Website updated and state saved (${{ matrix.region }})"
